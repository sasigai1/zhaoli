<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FDFDFB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>每日记录 · 原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone" id="phone" data-menu="closed">

    <header class="topbar">
      <h1 id="view-title">今日</h1>
      <span class="date-badge" id="date-badge"></span>
    </header>

    <main class="content" id="view-root"></main>

    <div class="mask" id="menu-mask"></div>

    <nav class="radial" aria-label="主导航">
      <button class="r-item" data-target="today">
        <span class="r-btn"><i data-lucide="pen-line"></i></span>
        <span class="r-label">今日</span>
      </button>
      <button class="r-item" data-target="calendar">
        <span class="r-btn"><i data-lucide="calendar-days"></i></span>
        <span class="r-label">日历</span>
      </button>
      <button class="r-item" data-target="stats">
        <span class="r-btn"><i data-lucide="chart-column"></i></span>
        <span class="r-label">统计</span>
      </button>
      <button class="r-item" data-target="search">
        <span class="r-btn"><i data-lucide="search"></i></span>
        <span class="r-label">搜索</span>
      </button>
      <button class="fab" id="fab" aria-label="打开菜单"><i data-lucide="plus"></i></button>
    </nav>

    <div class="mask" id="sheet-mask"></div>
    <section class="sheet" id="sheet" aria-label="日详情">
      <div class="sheet-top">
        <span class="sheet-date" id="sheet-date"></span>
        <button class="icon-btn" id="sheet-close" aria-label="关闭"><i data-lucide="x"></i></button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </section>

    <div class="toast" id="toast" role="status"></div>

  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
