<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<title>日程圆盘</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=minimalist%20app%20icon%2C%20warm%20white%20rounded%20square%20background%2C%20concentric%20circle%20ring%20segments%20in%20muted%20slate%20blue%20sage%20green%20amber%20rose%20colors%2C%20small%20white%20center%20hub%20with%20thin%20bronze%20ring%2C%20flat%20elegant%20design%2C%20schedule%20planner%20logo%2C%20centered%20composition%2C%20no%20text&image_size=square">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============ 圆盘主界面 ============ -->
  <section id="view-disc" class="view active">
    <div class="disc-stage">
      <div class="disc-head">
        <h1>日程圆盘</h1>
        <p id="disc-date"></p>
      </div>
      <svg id="disc-svg" viewBox="0 0 520 520" role="navigation" aria-label="主菜单圆盘"></svg>
      <p class="disc-hint">圆盘缓慢旋转 · 点击图层进入对应功能</p>
    </div>
  </section>

  <!-- ============ 日程（单日列表） ============ -->
  <section id="view-today" class="view page">
    <header class="page-head">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>圆盘</button>
      <h2>日程</h2><div class="head-spacer"></div>
    </header>
    <div class="page-body">
      <div class="date-nav">
        <button class="icon-btn" id="today-prev">‹</button>
        <div><div class="big-date" id="today-date"></div><div class="sub-date" id="today-week"></div></div>
        <button class="icon-btn" id="today-next">›</button>
      </div>
      <div style="text-align:center"><button class="text-btn" id="today-jump">回到今天</button></div>
      <div class="progress-wrap"><div id="today-progress"></div></div>
      <div id="today-list" class="item-list"></div>
    </div>
    <button class="fab" id="today-add" aria-label="添加日程">＋</button>
  </section>

  <!-- ============ 添加日程 ============ -->
  <section id="view-add" class="view page">
    <header class="page-head">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>圆盘</button>
      <h2>添加日程</h2><div class="head-spacer"></div>
    </header>
    <div class="page-body">
      <div class="card" id="add-form-host"></div>
      <button class="btn ghost block" id="add-goto-ai" style="margin-top:12px">试试一句话智能添加 →</button>
    </div>
  </section>

  <!-- ============ 月历 ============ -->
  <section id="view-month" class="view page">
    <header class="page-head">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>圆盘</button>
      <h2>月历</h2><div class="head-spacer"></div>
    </header>
    <div class="page-body">
      <div class="date-nav">
        <button class="icon-btn" id="month-prev">‹</button>
        <div class="big-date" id="month-title"></div>
        <button class="icon-btn" id="month-next">›</button>
      </div>
      <div style="text-align:center"><button class="text-btn" id="month-today">回到本月</button></div>
      <div class="week-row"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div id="month-grid" class="month-grid"></div>
    </div>
  </section>

  <!-- ============ 日历（年视图 / 任意日期） ============ -->
  <section id="view-year" class="view page">
    <header class="page-head">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>圆盘</button>
      <h2>日历</h2><div class="head-spacer"></div>
    </header>
    <div class="page-body">
      <div class="date-nav">
        <button class="icon-btn" id="year-prev" aria-label="上一年"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="big-date" id="year-title"></div>
        <button class="icon-btn" id="year-next" aria-label="下一年"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="jump-row card">
        <span>查看任意一天</span>
        <input type="date" class="input" id="year-jump">
        <button class="btn primary sm" id="year-jump-btn">查看</button>
      </div>
      <div id="year-grid" class="year-grid"></div>
    </div>
  </section>

  <!-- ============ 日程线 ============ -->
  <section id="view-timeline" class="view page">
    <header class="page-head">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>圆盘</button>
      <h2>日程线</h2><div class="head-spacer"></div>
    </header>
    <div class="page-body" id="timeline-body"></div>
  </section>

  <!-- ============ 分析 ============ -->
  <section id="view-stats" class="view page">
    <header class="page-head">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>圆盘</button>
      <h2>分析</h2><div class="head-spacer"></div>
    </header>
    <div class="page-body" id="stats-body"></div>
  </section>

  <!-- ============ AI 助手 ============ -->
  <section id="view-ai" class="view page">
    <header class="page-head">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>圆盘</button>
      <h2>AI 助手</h2><div class="head-spacer"></div>
    </header>
    <div class="page-body">
      <div class="ai-status" id="ai-status"></div>
      <div class="card">
        <div class="field">
          <label>一句话安排日程</label>
          <textarea class="input" id="ai-input" rows="4" placeholder="例如：今天有 3 个日程，分别是下午 3 点开产品会、晚上 7 点健身、明天上午 10 点看牙医"></textarea>
        </div>
        <div class="btn-row">
          <button class="btn primary" id="ai-parse">智能解析</button>
          <button class="btn ghost" id="ai-example">填入示例</button>
        </div>
      </div>
      <div id="ai-results" style="margin-top:14px"></div>
    </div>
  </section>

  <!-- ============ 设置 ============ -->
  <section id="view-settings" class="view page">
    <header class="page-head">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>圆盘</button>
      <h2>设置</h2><div class="head-spacer"></div>
    </header>
    <div class="page-body">
      <div class="panel">
        <h3>Gemini AI</h3>
        <div class="field"><label>API Key（保存在本机，不会上传）</label>
          <input class="input" type="password" id="set-key" placeholder="在 Google AI Studio 获取"></div>
        <div class="field"><label>模型</label>
          <input class="input" id="set-model" placeholder="gemini-2.5-flash"></div>
        <button class="btn primary block" id="set-save-ai">保存 AI 设置</button>
      </div>
      <div class="panel">
        <h3>提醒</h3>
        <div class="set-row"><span>系统通知提醒</span>
          <label class="switch"><input type="checkbox" id="set-notify"><i></i></label></div>
        <div class="set-row"><span>提示音</span>
          <label class="switch"><input type="checkbox" id="set-sound"><i></i></label></div>
        <button class="btn ghost block" id="set-test">测试提醒</button>
        <p class="hint">提醒需要保持本页面处于打开状态；首次开启请允许浏览器通知权限。</p>
      </div>
      <div class="panel">
        <h3>数据管理</h3>
        <div class="btn-row">
          <button class="btn ghost" id="btn-export">导出备份</button>
          <button class="btn ghost" id="btn-import">导入备份</button>
          <button class="btn danger" id="btn-clear">清空数据</button>
        </div>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
        <p class="hint">数据保存在本机浏览器中。更换手机或清理浏览器前，请先导出备份文件。</p>
      </div>
      <p class="hint center">日程圆盘 · 数据仅存于本机</p>
    </div>
  </section>

</div>

<div id="toast"></div>
<div id="modal-root"></div>

<script src="js/data.js"></script>
<script src="js/ai.js"></script>
<script src="js/reminder.js"></script>
<script src="js/app.js"></script>
</body>
</html>
